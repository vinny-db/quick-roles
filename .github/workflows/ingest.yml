name: Ingest jobs

on:
  schedule:
    - cron: '7 * * * *'        # hourly sources
    - cron: '23 */3 * * *'     # employer career pages
    - cron: '41 1,7,13,19 * * *' # 6-hourly sources (Remotive allows 4 calls a day)
  workflow_dispatch:
    inputs:
      cadence:
        description: 'hourly | 3h | 6h | all'
        default: 'all'
      only:
        description: 'comma-separated source ids (optional)'
        default: ''
      dry_run:
        description: 'Write to pipeline/out instead of the database'
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide cadence
        id: cad
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cadence=${{ github.event.inputs.cadence }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "7 * * * *" ]; then
            echo "cadence=hourly" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "23 */3 * * *" ]; then
            echo "cadence=3h" >> $GITHUB_OUTPUT
          else
            echo "cadence=6h" >> $GITHUB_OUTPUT
          fi
      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          mkdir -p pipeline/out
          set -o pipefail
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node pipeline/src/run.js --only "${{ github.event.inputs.only }}" 2>&1 | tee pipeline/out/log.txt
          else
            node pipeline/src/run.js --cadence "${{ steps.cad.outputs.cadence }}" 2>&1 | tee pipeline/out/log.txt
          fi
      - name: Publish run report to the reports branch
        if: always()
        run: |
          node pipeline/src/report.js || true
          git config user.name "quickroles-bot"
          git config user.email "bots@quickroles.africa"
          git fetch origin reports:reports 2>/dev/null || true
          git checkout -B reports
          git add -f reports/ pipeline/out/ || true
          git commit -m "Dry run report $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -f origin reports
